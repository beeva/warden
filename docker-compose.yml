services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    ports:
      - "5438:5432"
    volumes:
      - warden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  warden_pgdata:
